# Single source of truth for every tunable parameter.
# Each phase adds its own section; nothing is hard-coded in src/.

seed: 42

paths:
  raw: data/raw
  reference: data/reference
  interim: data/interim
  processed: data/processed
  figures: outputs/figures
  tables: outputs/tables

# AIS study period (Danish Maritime Authority daily files).
# Availability is verified at the start of phase A1.
dates:
  start: "2025-06-02"
  end: "2025-06-06"   # inclusive

# Area of interest as [lon_min, lat_min, lon_max, lat_max] (WGS84).
# "full" covers the DMA receiver footprint; "bornholm" is the zoom box
# used for the GNSS interference analysis (A4).
aoi:
  full: [3.0, 53.5, 17.0, 58.5]
  bornholm: [13.5, 54.5, 16.5, 56.0]

# Projected CRS for metric computations (ETRS89 / UTM zone 32N).
crs_metric: "EPSG:25832"

# ---------------------------------------------------------------- A1
download:
  base_url: "http://aisdata.ais.dk.s3.eu-central-1.amazonaws.com"
  keep_zip: true    # ~650 MB/day; lets us re-run without re-downloading
  keep_csv: false   # ~3.3 GB/day; deleted once staged to Parquet

cleaning:
  mobile_types: ["Class A", "Class B"]
  # Ship-station MMSI range: MID (first 3 digits) 201..775
  mmsi_min: 201000000
  mmsi_max: 775999999
  max_sog_kn: 60       # reported SOG above this is treated as invalid
  max_speed_kn: 50     # implied speed above this between two fixes = impossible move
  min_jump_m: 200      # ...but only if the fixes are also > 200 m apart (GNSS noise floor)
  spike_passes: 3      # iterations of isolated-spike removal
  stale_min_sog_kn: 1.0  # identical repeated position while SOG > this = stale re-stamped fix
  low_res_tol: 0.001     # tolerance (tenths of arc-minute) for msg-27 coarse-grid detection

trajectories:
  max_gap_min: 30      # a silence longer than this starts a new segment
  n_buckets: 16        # MMSI buckets for multi-day processing (memory bound)

# ---------------------------------------------------------------- shared zones (A2-A4)
zones:
  wpi_url: "https://msi.nga.mil/api/publications/download?key=16920959/SFH00000/UpdatedPub150.csv&type=download"
  port_radius_km:      # WPI positions are ~1' accurate; radius grows with harbour size
    Large: 8
    Medium: 5
    Small: 3
    Very Small: 2
    default: 2
  anchorage_cell_deg: 0.02     # ~2.2 km N-S x 1.3 km E-W at 55N
  anchorage_min_vessels: 3     # distinct vessels anchored/moored in a cell to call it routine
  anchorage_statuses: ["At anchor", "Moored"]

# ---------------------------------------------------------------- A2
dark:
  min_gap_h: 2                 # silence at least this long
  max_gap_speed_kn: 30         # crossing the gap faster than this = position jump, not silence
  coverage_cell_deg: 0.1       # empirical receiver-coverage grid
  coverage_min_vessels: 3      # other vessels heard in the cell in an hour = "covered"
  coverage_min_fraction: 0.8   # share of gap hours that must be covered, at both ends
  min_move_nm: 1.0             # reappearing at least this far away = moved while dark
  focus_ship_types: ["Cargo", "Tanker"]   # headline numbers for commercial traffic

maneuvers:
  window_min: 10               # compare each fix with the state 10 minutes earlier
  min_turn_deg: 150            # U-turn: course reversal of at least this much...
  turn_min_sog_kn: 5           # ...while making way (COG is meaningless near 0 kn)
  stop_from_kn: 8              # abrupt stop: from >= 8 kn...
  stop_to_kn: 2                # ...to <= 2 kn within the window
  merge_min: 30                # flagged fixes closer than this form one event
