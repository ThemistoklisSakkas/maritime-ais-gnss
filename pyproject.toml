[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime"
version = "0.1.0"
description = "Maritime AIS intelligence (dark activity, STS, GNSS interference, ETA) and GNSS-resilient INS/GNSS navigation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
geo = ["shapely>=2.0", "geopandas>=1.0", "pyproj>=3.6"]
ml = ["scikit-learn>=1.4"]
viz = ["matplotlib>=3.8", "streamlit>=1.35", "pydeck>=0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
all = ["maritime[geo,ml,viz]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
